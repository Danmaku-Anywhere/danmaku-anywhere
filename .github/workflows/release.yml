name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Tag to release'
        required: false
        type: string

jobs:
  validate-tag:
    if: github.event_name == 'workflow_dispatch' && inputs.target_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a release tag on master
        env:
          TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::target_tag must look like v1.2.3"
            exit 1
          fi
          git fetch --tags --force origin master
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG does not exist"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/master; then
            echo "::error::Tag $TAG is not on master"
            exit 1
          fi

  call-build:
    needs: validate-tag
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-extension.yml
    with:
      ref: ${{ inputs.target_tag || github.ref }}
      version_suffix: ''
    secrets:
      CRX_SECRET_KEY: ${{ secrets.CRX_SECRET_KEY }}

  publish-release:
    needs: call-build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by ncipollo/release-action
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target_tag != '')
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-files
          path: packages

      - name: Publish Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          updateOnlyUnreleased: true
          artifacts: "packages/*"
          tag: ${{ inputs.target_tag || github.ref_name }}
          generateReleaseNotes: true
          makeLatest: true
          draft: true

  publish-chrome:
    needs: call-build
    runs-on: ubuntu-latest
    environment: chrome-web-store-publish
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target_tag != '')
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-files
          path: packages

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@4008e29e13c144d0f6725462cbd49b7c291b4928 # v5.0.0
        with:
          file-path: "packages/*chrome.zip"
          extension-id: ${{ vars.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          glob: true
          publish: false

  publish-firefox:
    needs: call-build
    runs-on: ubuntu-latest
    environment: firefox-addon-publish
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target_tag != '')
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-files
          path: packages

      - uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1.2.1
        name: Upload to Mozilla Add-ons
        with:
          addon-guid: ${{ vars.ADDON_ID }}
          xpi-path: "packages/*firefox.zip"
          self-hosted: false
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          compatibility: firefox,android