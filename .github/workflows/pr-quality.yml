name: PR Quality Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [26.x]

    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache built workspace packages
        uses: actions/cache@v4
        with:
          path: packages/*/dist
          key: built-packages-${{ runner.os }}-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'tsconfig.base.json', 'tsconfig.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            built-packages-${{ runner.os }}-

      - name: Build dependencies
        run: pnpm build:packages

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Type check
        run: pnpm type-check

      - name: Lint (autofix)
        run: pnpm lint

      - name: Commit lint fixes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "(chore) apply lint autofix"

      - name: Checkout the docs site
        uses: actions/checkout@v4
        with:
          repository: Danmaku-Anywhere/docs
          path: .ci/docs

      - name: Test (changed packages only)
        run: pnpm --filter '...[${{ github.event.pull_request.base.sha }}]' test
        env:
          DA_DOCS_DIR: ${{ github.workspace }}/.ci/docs

  fallow:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory only: findings show up as annotations, in the job summary and
      # as one PR comment that is updated on each push.
      # Exit 1 means findings and is let through; anything higher is a fallow error.
      - name: Fallow audit
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          pnpm -s fallow audit --base "$BASE" --skip health --format github-annotations || [ $? -eq 1 ]
          pnpm -s fallow audit --base "$BASE" --skip health --format github-summary >> "$GITHUB_STEP_SUMMARY" || [ $? -eq 1 ]
          pnpm -s fallow audit --base "$BASE" --skip health --format pr-comment-github > "$RUNNER_TEMP/fallow-comment.md" || [ $? -eq 1 ]

      # Pull requests from forks get a read-only token, so this step may fail there.
      - name: Comment on the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/fallow-comment.md"
          marker=$(head -n1 "$body")
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$body" > /dev/null
          elif ! grep -q 'No findings for this pull request' "$body"; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi
