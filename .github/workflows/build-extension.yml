name: Build Extension

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        description: "The git SHA/Tag/Branch to checkout"
      version_suffix:
        required: false
        type: string
        description: "String (number) to append to the version (e.g., build number)"
    secrets:
      CRX_SECRET_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_PROXY_ORIGIN: ${{ vars.VITE_PROXY_ORIGIN }}
      VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
      VERSION_SUFFIX: ${{ inputs.version_suffix }}

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # uses version from package.json > packageManager

      - name: Require the proxy URL for release builds
        run: |
          if [ -z "$VITE_PROXY_URL" ] || [ -z "$VITE_PROXY_ORIGIN" ]; then
            echo "::error::VITE_PROXY_URL and VITE_PROXY_ORIGIN must be set, otherwise the build ships 'undefined' backend URLs"
            exit 1
          fi

      - name: Install and build dependencies
        run: |
          pnpm install
          pnpm build:packages

      - name: Package
        run: |
          cd packages/danmaku-anywhere
          pnpm package
          pnpm build:firefox
          pnpm package:firefox

      - name: Assert dev API is stripped from prod bundle (DCE guard)
        working-directory: packages/danmaku-anywhere
        run: |
          if grep -rE "DevApiError|Unknown dev API|Read/write provider configs|Service worker lifecycle and metadata" build/ ; then
            echo "::error::Dev API implementation leaked into prod build (DCE guard failed)"
            exit 1
          fi

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: package-unsigned
          path: packages/danmaku-anywhere/package/*.zip

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned build
        uses: actions/download-artifact@v4
        with:
          name: package-unsigned
          path: package

      - name: Resolve Chrome ZIP path for CRX
        id: crx_paths
        continue-on-error: true
        shell: bash
        run: |
          ZIP=$(ls package/*-chrome.zip)
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          CRX="${ZIP%.zip}.crx"
          echo "crx=$CRX" >> $GITHUB_OUTPUT

      - name: Build .crx from Chrome ZIP
        uses: cardinalby/webext-buildtools-chrome-crx-action@2d3b64d6a82a252eac2dc82ee90760c5217024fa # v2
        continue-on-error: true
        with:
          zipFilePath: ${{ steps.crx_paths.outputs.zip }}
          crxFilePath: ${{ steps.crx_paths.outputs.crx }}
          privateKey: ${{ secrets.CRX_SECRET_KEY }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-files
          path: |
            package/*.zip
            package/*.crx
