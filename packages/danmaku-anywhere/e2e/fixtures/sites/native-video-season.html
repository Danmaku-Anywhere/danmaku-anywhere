<!--
  Native-video fixture for a show whose season sits in its own element, the
  way Plex and Jellyfin render it. Same data-testid hooks as native-video.html
  plus da-season, which the spec's policy reads as the season selector.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Integration test page with a season</title>
  </head>
  <body>
    <h1 data-testid="da-title">DA Integration Test</h1>
    <span data-testid="da-season">Season 2</span>
    <span data-testid="da-episode">Episode 1</span>
    <video data-testid="da-video" playsinline></video>
  </body>
</html>
